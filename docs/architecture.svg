<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Amazon Connect Customer Posture Assessment Tool deployment architecture</title>
  <desc id="diagram-desc">One-account assessment runner for a selected Connect Region, with linked service reads that may cross Regions, a 64-control catalog, self-contained browser report, and optional S3 publication.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#247BA0"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#879596"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D86613"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8E44AD"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #232F3E; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #5F6B7A; }
      .boundary-title { font-size: 16px; font-weight: 700; }
      .section-title { font-size: 14px; font-weight: 700; }
      .box-title { font-size: 13px; font-weight: 700; }
      .body { font-size: 12px; }
      .small { font-size: 11px; fill: #5F6B7A; }
      .center { text-anchor: middle; }
      .box { fill: #FFFFFF; stroke: #879596; stroke-width: 1.5; rx: 10; }
      .blue { fill: #EAF3F8; stroke: #247BA0; stroke-width: 2; rx: 10; }
      .orange { fill: #FDF3E7; stroke: #D86613; stroke-width: 2; rx: 10; }
      .purple { fill: #F3EAF7; stroke: #8E44AD; stroke-width: 2; rx: 10; }
      .pink { fill: #FFF7FA; stroke: #C2185B; stroke-width: 1.5; rx: 10; }
      .green { fill: #F4F9E9; stroke: #7AA116; stroke-width: 1.5; rx: 10; }
      .boundary { fill: #F7F8FA; stroke: #879596; stroke-width: 2; rx: 14; }
      .optional { stroke-dasharray: 8 6; }
      .edge-blue { fill: none; stroke: #247BA0; stroke-width: 2; marker-end: url(#arrow-blue); }
      .edge-gray { fill: none; stroke: #879596; stroke-width: 1.5; marker-end: url(#arrow-gray); }
      .edge-orange { fill: none; stroke: #D86613; stroke-width: 2; marker-end: url(#arrow-orange); }
      .edge-purple { fill: none; stroke: #8E44AD; stroke-width: 2; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="#FFFFFF"/>
  <text x="900" y="48" class="title center">Amazon Connect Customer Posture Assessment Tool — Deployment Architecture</text>
  <text x="900" y="78" class="subtitle center">One run selects one account and Connect Region; linked integrations may be read in another Region, and the report may include multiple Connect instances.</text>

  <rect x="40" y="105" width="850" height="1015" class="boundary"/>
  <rect x="930" y="105" width="830" height="1015" class="boundary"/>
  <text x="465" y="135" class="boundary-title center">Assessment runner and self-contained report</text>
  <text x="465" y="155" class="body center">local workstation, AWS CloudShell, or CI runner / browser</text>
  <text x="1345" y="135" class="boundary-title center">Target AWS account / selected Connect Region and linked service Regions</text>

  <rect x="75" y="170" width="190" height="68" class="box"/>
  <text x="170" y="198" class="box-title center">CLI</text><text x="170" y="218" class="body center">amazon-connect-assessment</text>
  <rect x="285" y="170" width="190" height="68" class="box"/>
  <text x="380" y="198" class="box-title center">Configuration</text><text x="380" y="218" class="body center">YAML / JSON</text>
  <rect x="495" y="170" width="360" height="68" class="box"/>
  <text x="675" y="194" class="box-title center">AWS SDK credential chain</text>
  <text x="675" y="214" class="body center">profile, environment, CloudShell / compute role,</text><text x="675" y="230" class="body center">OIDC-provided credentials</text>

  <rect x="75" y="280" width="330" height="72" class="blue"/>
  <text x="240" y="309" class="box-title center" fill="#164A63">AWSClientFactory</text><text x="240" y="330" class="body center" fill="#164A63">boto3 clients, retries, throttling, permission checks</text>
  <rect x="445" y="280" width="410" height="72" class="blue"/>
  <text x="650" y="303" class="box-title center" fill="#164A63">AssessmentEngine</text><text x="650" y="322" class="body center" fill="#164A63">discover, analyze, execute, summarize</text><text x="650" y="340" class="body center" fill="#164A63">sequential or parallel execution</text>

  <path d="M170 238 V260 H180 V280" class="edge-gray"/><path d="M380 238 V260 H240 V280" class="edge-gray"/><path d="M675 238 V260 H300 V280" class="edge-gray"/>
  <path d="M405 316 H445" class="edge-blue"/>

  <rect x="75" y="395" width="780" height="205" class="orange"/>
  <text x="95" y="423" class="section-title" fill="#7A3D0B">Immutable 64-control catalog</text>
  <rect x="95" y="440" width="350" height="72" class="box" style="stroke:#D86613"/>
  <text x="270" y="466" class="box-title center" fill="#7A3D0B">60 BaseCheck executors</text><text x="270" y="486" class="body center">instance, flows, queues, integrations, IAM, security,</text><text x="270" y="502" class="body center">cost, resilience, operations, performance</text>
  <rect x="465" y="440" width="370" height="72" class="box" style="stroke:#D86613"/>
  <text x="650" y="466" class="box-title center" fill="#7A3D0B">4 Journey-backed executors</text><text x="650" y="488" class="body center">topology → super-graph → bounded paths → Journey scoring</text>
  <rect x="95" y="525" width="740" height="64" fill="#FFF8F0" stroke="#D86613" stroke-width="1.5" rx="10"/>
  <text x="465" y="547" class="box-title center" fill="#7A3D0B">Catalog-owned dispositions + shared score policy</text>
  <text x="465" y="566" class="body center">23 Control · 25 Manual Review · 16 Informational</text>
  <text x="465" y="583" class="body center">Only scored control PASS / FAIL contributes to posture.</text>
  <path d="M650 352 V375 H465 V395" class="edge-orange"/>

  <rect x="75" y="625" width="780" height="94" class="pink"/>
  <text x="95" y="649" class="box-title" fill="#7A173F">Three flow-dependent, Connect-side ACXD checks</text>
  <text x="95" y="668" class="body">Agentic CX Handoff Inventory · ACXD Error Routing · ACXD Escalation Review</text>
  <text x="95" y="687" class="body">Evidence: reachable Connect flow handoffs, authored branches, identifiers, optional feature presence, and redacted context-variable names.</text>
  <text x="95" y="706" class="body">No Agentic CX API calls; no inspection of application content, builds, deployments, alias resolution, runtime containment, or guardrails.</text>

  <rect x="75" y="755" width="370" height="82" class="purple"/>
  <text x="260" y="781" class="box-title center" fill="#5A2B6E">Python ReportGenerator</text><text x="260" y="801" class="body center">builds report-data JSON; embeds committed</text><text x="260" y="818" class="body center">report-app.js / report-app.css into a self-contained HTML shell</text>
  <rect x="485" y="755" width="370" height="82" class="purple"/>
  <text x="670" y="781" class="box-title center" fill="#5A2B6E">frontend/ maintained source</text><text x="670" y="801" class="body center">React + Cloudscape</text><text x="670" y="818" class="body center">builds committed app assets</text>
  <path d="M75 600 H60 V740 H260 V755" class="edge-purple"/>
  <path d="M485 796 H445" class="edge-purple optional"/><text x="465" y="747" class="small center">committed build assets</text>

  <rect x="75" y="865" width="780" height="88" class="blue"/>
  <text x="95" y="891" class="box-title" fill="#164A63">Browser report-wide instance scope derives one scoped assessment view</text>
  <text x="95" y="912" class="body">Summary / insights · charts · recommendations · findings · Journey map · assessment details · print / PDF</text>
  <text x="95" y="933" class="body">Clickable metrics and chart segments set exact finding-filter queries.</text>
  <path d="M260 837 V865" class="edge-purple"/>

  <rect x="75" y="975" width="370" height="72" class="box" style="stroke:#247BA0"/>
  <text x="260" y="997" class="box-title center" fill="#164A63">Adaptive evidence</text><text x="260" y="1016" class="body center">wide viewport: tables · narrow viewport: cards</text><text x="260" y="1034" class="body center">full values retained for copy, detail, and print</text>
  <rect x="485" y="975" width="370" height="72" class="box"/>
  <text x="670" y="995" class="box-title center">Local / browser outputs</text><text x="670" y="1014" class="body center">HTML · JSON · CSV: full assessment</text><text x="670" y="1033" class="body center">ASFF: failed controls · print / PDF: selected scope</text>
  <path d="M300 953 V975" class="edge-blue"/><path d="M630 953 V975" class="edge-gray"/>
  <text x="75" y="1082" class="small">No application backend or persistent service is deployed. The runner performs the assessment and exits;</text>
  <text x="75" y="1099" class="small">the generated HTML runs locally in the reader's browser.</text>

  <rect x="970" y="170" width="205" height="68" class="purple optional"/>
  <text x="1072" y="198" class="box-title center" fill="#5A2B6E">AWS CloudFormation</text><text x="1072" y="218" class="body center">optional operator-run IAM setup</text>
  <rect x="1210" y="170" width="245" height="68" class="box"/>
  <text x="1332" y="195" class="box-title center">Assessment read-only managed policy</text><text x="1332" y="216" class="body center">optional role / user / group attachment</text>
  <rect x="1490" y="170" width="225" height="68" class="box"/>
  <text x="1602" y="198" class="box-title center">AWS IAM</text><text x="1602" y="218" class="body center">credentialed principal</text>
  <path d="M1175 204 H1210" class="edge-purple optional"/><path d="M1455 204 H1490" class="edge-purple optional"/>
  <text x="970" y="263" class="small">Standard boto3 credentials are resolved by the runner; the tool does not perform cross-account role assumption.</text>

  <rect x="970" y="315" width="745" height="46" class="blue"/>
  <text x="1342" y="344" class="box-title center" fill="#164A63">Signed read-only AWS service API requests</text>
  <path d="M855 316 H910 V338 H970" class="edge-blue"/>

  <rect x="970" y="390" width="745" height="435" class="box" style="stroke:#C5D0D5"/>
  <text x="990" y="420" class="section-title" fill="#5F6B7A">Preserved inspection targets</text>
  <path d="M1342 361 V390" class="edge-blue"/>
  <rect x="995" y="440" width="330" height="78" class="pink"/><text x="1160" y="471" class="box-title center" fill="#7A173F">Amazon Connect</text><text x="1160" y="493" class="body center">instances, flows, queues, routing, phone numbers</text>
  <rect x="1360" y="440" width="330" height="78" class="pink"/><text x="1525" y="471" class="box-title center" fill="#7A173F">Amazon CloudWatch</text><text x="1525" y="493" class="body center">metrics, alarms, logs</text>
  <rect x="995" y="535" width="330" height="78" class="pink"/><text x="1160" y="567" class="box-title center" fill="#7A173F">AWS CloudTrail</text><text x="1160" y="589" class="body center">trail config and failover events</text>
  <rect x="1360" y="535" width="330" height="78" class="green"/><text x="1525" y="567" class="box-title center" fill="#40560B">Amazon S3</text><text x="1525" y="589" class="body center">Connect storage configuration</text>
  <rect x="995" y="630" width="220" height="78" fill="#FFF6EA" stroke="#ED7100" stroke-width="1.5" rx="10"/><text x="1105" y="661" class="box-title center" fill="#7A3D0B">AWS Lambda</text><text x="1105" y="683" class="body center">integration and usage</text>
  <rect x="1232" y="630" width="220" height="78" class="pink" style="stroke:#CD2264"/><text x="1342" y="661" class="box-title center" fill="#7A173F">Amazon Lex</text><text x="1342" y="683" class="body center">bot integrations</text>
  <rect x="1470" y="630" width="220" height="78" fill="#FFF1F2" stroke="#DD344C" stroke-width="1.5" rx="10"/><text x="1580" y="661" class="box-title center" fill="#7A173F">AWS KMS</text><text x="1580" y="683" class="body center">encryption posture</text>
  <rect x="995" y="720" width="165" height="66" class="pink"/><text x="1077" y="746" class="box-title center" fill="#7A173F">Service Quotas</text><text x="1077" y="768" class="body center">Connect limits</text>
  <rect x="1172" y="720" width="165" height="66" class="pink"/><text x="1254" y="746" class="box-title center" fill="#7A173F">AWS IAM</text><text x="1254" y="768" class="body center">roles and policies</text>
  <rect x="1349" y="720" width="165" height="66" class="pink"/><text x="1431" y="746" class="box-title center" fill="#7A173F">Amazon Q in Connect</text><text x="1431" y="768" class="body center">AI configuration</text>
  <rect x="1526" y="720" width="164" height="66" class="pink"/><text x="1608" y="746" class="box-title center" fill="#7A173F">Amazon Bedrock</text><text x="1608" y="768" class="body center">logging and profiles</text>
  <text x="995" y="810" class="small">Connect flow JSON supplies ACXD handoff evidence; Agentic CX application internals are not inspected.</text>

  <rect x="970" y="855" width="745" height="200" class="purple optional"/>
  <text x="990" y="885" class="section-title" fill="#5A2B6E">Report publication — opt-in --s3-output only</text>
  <rect x="995" y="910" width="310" height="72" class="green"/>
  <text x="1150" y="932" class="box-title center" fill="#40560B">Amazon S3 report bucket</text><text x="1150" y="950" class="body center">Block Public Access · versioning</text><text x="1150" y="968" class="body center">SSE-S3 report uploads</text>
  <text x="1330" y="925" class="body">Assessment execution otherwise reads configuration and telemetry.</text><text x="1330" y="945" class="body">--s3-output is the only assessment write path.</text><text x="1330" y="965" class="body">Optional IAM setup is a separate operator-run provisioning action.</text>
  <path d="M430 837 V850 H900 V946 H995" class="edge-purple optional"/>
  <text x="970" y="1084" class="small">Browser report scope filters Connect instances in this run; it does not expand the account or</text>
  <text x="970" y="1101" class="small">Connect Region assessed.</text>

  <text x="40" y="1168" class="box-title">Legend</text>
  <rect x="115" y="1149" width="200" height="26" class="blue"/><text x="215" y="1167" class="small center" fill="#164A63">Read-only inspection path</text>
  <rect x="335" y="1149" width="230" height="26" class="purple optional"/><text x="450" y="1167" class="small center" fill="#5A2B6E">Optional setup / S3 publication</text>
  <rect x="585" y="1149" width="210" height="26" class="boundary"/><text x="690" y="1167" class="small center">Execution or trust boundary</text>
</svg>
