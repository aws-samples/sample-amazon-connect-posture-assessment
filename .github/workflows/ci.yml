name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Lint with Ruff
        run: |
          ruff check --output-format=github amazon_connect_assessment/ tests/

      - name: Check formatting with Ruff
        run: |
          ruff format --check --diff amazon_connect_assessment/ tests/

      - name: Type check with mypy
        run: |
          mypy amazon_connect_assessment/ --ignore-missing-imports

      - name: Run tests
        run: |
          pytest --cov=amazon_connect_assessment --cov-report=xml --cov-fail-under=65

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  report-ui:
    # The HTML report inlines the pre-built Cloudscape bundle committed under
    # amazon_connect_assessment/templates/app/. Rebuild it from frontend/ and
    # fail if the committed copy is stale.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runtime deps are inlined into every HTML report, so a vulnerable
      # lockfile ships to users; fail on high/critical advisories.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Rebuild bundle and check it is committed
        run: npm run check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt
