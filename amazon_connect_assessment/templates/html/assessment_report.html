<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Self-contained report: only the hash-pinned inline bundle may run, images are limited to data:/blob:, and no network access is permitted. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src @@STYLE_SRC@@; script-src @@SCRIPT_SRC@@; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>@@REPORT_TITLE@@</title>
    <style>@@APP_CSS@@</style>
</head>
<body>
    <div id="root">
        <noscript>
            This report is an interactive page and needs JavaScript enabled.
            The same findings are available in the JSON and CSV exports.
        </noscript>
    </div>
    <script id="report-data" type="application/json">@@REPORT_DATA_JSON@@</script>
    <script>@@APP_JS@@</script>
</body>
</html>
